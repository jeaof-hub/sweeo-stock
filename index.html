<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สต็อกสินค้า SWEEO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="wrap">
<header class="top">
<div class="bar">
<div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--brand-ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></div>
<div class="title"><h1>สต็อกสินค้า SWEEO</h1><p id="status">กำลังโหลดข้อมูล</p></div>
<div class="who">
<span class="badge" id="roleBadge">ผู้เยี่ยมชม</span>
<button class="btn" id="loginBtn" type="button">เข้าสู่ระบบ</button>
<div class="menu" id="userMenu" hidden>
<button class="btn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false">บัญชี</button>
<div class="pop" id="menuPop" hidden>
<div class="me" id="meEmail"></div>
<button type="button" id="exportBtn" hidden>ส่งออก Excel</button>
<button type="button" id="pwBtn">เปลี่ยนรหัสผ่าน</button>
<button type="button" id="logoutBtn">ออกจากระบบ</button>
</div>
</div>
</div>
</div>
<div class="tabs" role="tablist" id="tabs" hidden>
<button class="tab" role="tab" id="tabStock" aria-selected="true" type="button">สต็อก</button>
<button class="tab" role="tab" id="tabLog" aria-selected="false" type="button">ประวัติรับเข้า/ส่งออก</button>
<button class="tab" role="tab" id="tabUsers" aria-selected="false" type="button" hidden>ผู้ใช้งาน</button>
</div>
</header>

<p class="banner" id="banner" hidden></p>

<section id="viewStock">
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="q" type="search" placeholder="ค้นหารุ่น รหัสสินค้า หรือสเปก" autocomplete="off" aria-label="ค้นหาสินค้า"></div>
<div class="alerts" id="alerts" role="group" aria-label="สถานะสต็อก" hidden></div>
<div class="filters">
<select id="fType" aria-label="ประเภทสินค้า"><option value="">ทุกประเภท</option></select>
<select id="fDept" aria-label="แผนก"><option value="">ทุกแผนก</option></select>
<select id="fSort" aria-label="เรียงลำดับ">
<option value="order">เรียงตามรายการเดิม</option>
<option value="balDesc">คงเหลือ มาก → น้อย</option>
<option value="balAsc">คงเหลือ น้อย → มาก</option>
<option value="avgDesc" data-staff>ขายต่อเดือน มากสุด</option>
<option value="cover" data-staff>ใกล้หมดก่อน</option>
</select>
<label class="chk"><input type="checkbox" id="fZero" checked> ซ่อนรายการที่คงเหลือ 0</label>
</div>
<div class="count"><span id="count"></span><button class="btn sm" id="newItemBtn" type="button" hidden>เพิ่มสินค้าใหม่</button></div>
<main class="list" id="list" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
</section>

<section id="viewLog" hidden>
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="lq" type="search" placeholder="ค้นหาลูกค้า เลขเอกสาร หรือรุ่น" autocomplete="off" aria-label="ค้นหาประวัติ"></div>
<div class="filters">
<select id="lMonth" aria-label="เดือน"></select>
<select id="lKind" aria-label="ประเภทรายการ"><option value="">รับเข้าและส่งออก</option><option value="out">เฉพาะส่งออก</option><option value="in">เฉพาะรับเข้า</option></select>
<select id="lDept" aria-label="แผนก"><option value="">ทุกแผนก</option></select>
</div>
<div class="count"><span id="lcount"></span></div>
<div id="log"></div>
</section>

<section id="viewUsers" hidden>
<div class="count"><span id="ucount"></span><button class="btn sm primary" id="inviteBtn" type="button">เชิญผู้ใช้ใหม่</button></div>
<div id="userList" class="list"></div>
</section>
</div>

<div class="actions" id="actions" hidden><div class="in">
<button class="btn primary" type="button" id="outBtn">บันทึกส่งออก</button>
<button class="btn" type="button" id="inBtn">บันทึกรับเข้า</button>
</div></div>

<dialog id="dLogin" aria-labelledby="lgTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="lgTitle">เข้าสู่ระบบ</h2><p>สำหรับพนักงานที่ได้รับบัญชีจากผู้ดูแลระบบ</p></div><button class="btn x" type="button" data-close>ปิด</button></div>
<form class="dlg-body" id="loginForm">
<div class="grid">
<div class="f full"><label for="lgEmail">อีเมล</label><input id="lgEmail" type="email" autocomplete="username" required></div>
<div class="f full"><label for="lgPw">รหัสผ่าน</label><input id="lgPw" type="password" autocomplete="current-password" required></div>
</div>
<p class="note">ลืมรหัสผ่าน ติดต่อผู้ดูแลระบบเพื่อรีเซ็ต</p>
</form>
<div class="dlg-foot"><span class="msg" id="lgMsg"></span><button class="btn primary" type="submit" form="loginForm" id="lgSubmit">เข้าสู่ระบบ</button></div>
</div></dialog>

<dialog id="dPw" aria-labelledby="pwTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="pwTitle">เปลี่ยนรหัสผ่าน</h2></div><button class="btn x" type="button" data-close>ยกเลิก</button></div>
<form class="dlg-body" id="pwForm">
<div class="grid">
<div class="f full"><label for="pw1">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input id="pw1" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="f full"><label for="pw2">ยืนยันรหัสผ่านใหม่</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></div>
</div>
</form>
<div class="dlg-foot"><span class="msg" id="pwMsg"></span><button class="btn primary" type="submit" form="pwForm">บันทึกรหัสผ่าน</button></div>
</div></dialog>

<dialog id="dItem" aria-labelledby="iTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="iTitle"></h2><p id="iSub"></p></div><button class="btn x" type="button" data-close>ปิด</button></div>
<div class="dlg-body" id="iBody"></div>
</div></dialog>

<dialog id="dEntry" aria-labelledby="eTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="eTitle"></h2><p id="eSub"></p></div><button class="btn x" type="button" data-close>ยกเลิก</button></div>
<div class="dlg-body">
<div class="grid">
<div class="f"><label for="eDate">วันที่</label><input type="date" id="eDate" required></div>
<div class="f"><label for="eInv" id="eInvL">เลขที่ INV / เอกสาร</label><input id="eInv" autocomplete="off"></div>
<div class="f full"><label for="eCust" id="eCustL">ลูกค้า</label><input id="eCust" list="custList" autocomplete="off"></div>
<div class="f"><label for="eDept">แผนก / ประเภทงาน</label><input id="eDept" list="deptList" autocomplete="off"></div>
<div class="f"><label for="eSale">เซลส์</label><input id="eSale" list="saleList" autocomplete="off"></div>
<div class="f full"><label for="eNote">หมายเหตุ</label><input id="eNote" autocomplete="off"></div>
</div>
<div class="lines" id="eLines"></div>
<button class="btn" type="button" id="addLine" style="margin-top:10px">เพิ่มสินค้าอีกรายการ</button>
</div>
<div class="dlg-foot"><span class="msg" id="eMsg"></span><button class="btn primary" type="button" id="eSave">บันทึก</button></div>
</div></dialog>

<dialog id="dCount" aria-labelledby="cTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="cTitle">ปรับยอดตามการตรวจนับ</h2><p id="cSub"></p></div><button class="btn x" type="button" data-close>ยกเลิก</button></div>
<div class="dlg-body">
<div class="grid">
<div class="f"><label for="cQty">จำนวนที่นับได้จริง</label><input id="cQty" type="number" inputmode="numeric" min="0" step="1"></div>
<div class="f"><label for="cDate">วันที่นับ</label><input id="cDate" type="date"></div>
<div class="f full"><label for="cNote">หมายเหตุ</label><input id="cNote" autocomplete="off" placeholder="เช่น นับซ้ำแล้ว ผู้นับ"></div>
</div>
<div class="diff" id="cDiff"></div>
</div>
<div class="dlg-foot"><span class="msg" id="cMsg"></span><button class="btn primary" type="button" id="cSave">บันทึกการปรับยอด</button></div>
</div></dialog>

<dialog id="dEdit" aria-labelledby="edTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="edTitle"></h2><p id="edSub"></p></div><button class="btn x" type="button" data-close>ยกเลิก</button></div>
<div class="dlg-body">
<div class="grid">
<div class="f"><label for="xCode">รหัสสินค้า (Lot No.)</label><input id="xCode" autocomplete="off"></div>
<div class="f"><label for="xModel">รุ่น (Model No.)</label><input id="xModel" autocomplete="off"></div>
<div class="f full"><label for="xSpec">สเปก</label><input id="xSpec" autocomplete="off"></div>
<div class="f"><label for="xType">ประเภท</label><input id="xType" list="typeList" autocomplete="off"></div>
<div class="f"><label for="xDept">แผนก</label><input id="xDept" list="itemDeptList" autocomplete="off"></div>
<div class="f"><label for="xLoc">ที่เก็บ</label><input id="xLoc" autocomplete="off"></div>
<div class="f"><label for="xOpen">ยอดยกมา</label><input id="xOpen" type="number" inputmode="numeric" step="1"></div>
<div class="f"><label for="xAvg">ขายเฉลี่ยต่อเดือน</label><input id="xAvg" type="number" inputmode="decimal" step="0.1"></div>
<div class="f"><label for="xRop">จุดสั่งผลิต (ROP)</label><input id="xRop" type="number" inputmode="numeric" step="1"></div>
<div class="f full"><label for="xRemark">หมายเหตุ</label><input id="xRemark" autocomplete="off"></div>
</div>
<p class="note" id="xHint"></p>
</div>
<div class="dlg-foot"><span class="msg" id="xMsg"></span><button class="btn primary" type="button" id="xSave">บันทึกข้อมูลสินค้า</button></div>
</div></dialog>

<dialog id="dConfirm" aria-labelledby="kTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="kTitle"></h2><p id="kSub"></p></div></div>
<div class="dlg-foot"><span class="msg" id="kMsg"></span><button class="btn" type="button" data-close>ไม่ลบ</button><button class="btn danger" type="button" id="kOk">ลบรายการ</button></div>
</div></dialog>

<dialog id="dInvite" aria-labelledby="ivTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="ivTitle">เชิญผู้ใช้ใหม่</h2><p>ระบบจะส่งอีเมลเชิญให้ตั้งรหัสผ่านเอง</p></div><button class="btn x" type="button" data-close>ยกเลิก</button></div>
<form class="dlg-body" id="inviteForm">
<div class="grid">
<div class="f full"><label for="ivEmail">อีเมล</label><input id="ivEmail" type="email" autocomplete="off" required></div>
<div class="f full"><label for="ivName">ชื่อ</label><input id="ivName" autocomplete="off"></div>
<div class="f full"><label for="ivRole">ตำแหน่ง</label>
<select id="ivRole"><option value="staff">ผู้แก้ไข (Staff)</option><option value="founder">ผู้ก่อตั้ง (Founder)</option></select>
</div>
</div>
</form>
<div class="dlg-foot"><span class="msg" id="ivMsg"></span><button class="btn primary" type="submit" form="inviteForm" id="ivSubmit">ส่งคำเชิญ</button></div>
</div></dialog>

<dialog id="dEditUser" aria-labelledby="euTitle"><div class="dlg">
<div class="dlg-head"><div><h2 id="euTitle"></h2><p id="euSub"></p></div><button class="btn x" type="button" data-close>ยกเลิก</button></div>
<div class="dlg-body">
<div class="grid">
<div class="f"><label for="euRole">ตำแหน่ง</label>
<select id="euRole"><option value="staff">ผู้แก้ไข (Staff)</option><option value="founder">ผู้ก่อตั้ง (Founder)</option></select>
</div>
<div class="f"><label for="euActive">สถานะ</label>
<select id="euActive"><option value="true">ใช้งาน</option><option value="false">ปิดใช้งาน</option></select>
</div>
<div class="f full"><label for="euName">ชื่อ</label><input id="euName" autocomplete="off"></div>
</div>
</div>
<div class="dlg-foot"><span class="msg" id="euMsg"></span><button class="btn primary" type="button" id="euSave">บันทึก</button></div>
</div></dialog>

<datalist id="custList"></datalist><datalist id="deptList"></datalist><datalist id="saleList"></datalist>
<datalist id="typeList"></datalist><datalist id="itemDeptList"></datalist>

<script src="app.js"></script>
</body>
</html>
